[project]
name = "font-render-server"
version = "1.0.1"
description = "Font rendering comparison service using Windows DirectWrite (headless Chromium)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "playwright",
    "requests",
    "pillow",
    "psutil>=7.2.2",
    "fonttools>=4.66.1",
    "brotli>=1.2.0",
    "cryptography>=46",
    "packaging>=25",
    "font-render-client",
]

[project.scripts]
font-render-server = "font_render.__main__:main"
pixel-check = "font_render_tools.pixel_check:main"
# font-render, font-render-batch, font-render-clients: the client/ package (font-render-client)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/font_render", "src/font_render_tools"]

[tool.uv.workspace]
members = ["client"]

[tool.uv.sources]
font-render-client = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "httpx",  # starlette TestClient
    "fonttools>=4.66.1",
    "pytest>=9.1.1",
]
