[project]
name = "font-render-client"
version = "1.1.0"
description = "Command-line client of the Font Render Service: render fonts on a Windows DirectWrite server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["requests"]

[project.urls]
Homepage = "https://github.com/typedev/font-render-server"

[project.scripts]
font-render = "font_render_client.client:main"
font-render-batch = "font_render_client.batch_render:main"
font-render-clients = "font_render_client.manage_clients:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/font_render_client"]
